packages:
  - docs

gitChecks: false

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  core-js-pure: false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  vue-demi: true
  workerd: true

# A frozen install refuses day-old releases. The @agntn glob keeps CI green the day a sibling ships.
minimumReleaseAgeExclude:
  - "@agntn/*"
  - "@oh-my-pi/hashline@18.0.0"
  - "@oh-my-pi/omp-stats@18.0.0"
  - "@oh-my-pi/omptype@18.0.0"
  - "@oh-my-pi/pi-agent-core@18.0.0"
  - "@oh-my-pi/pi-ai@18.0.0"
  - "@oh-my-pi/pi-catalog@18.0.0"
  - "@oh-my-pi/pi-coding-agent@18.0.0"
  - "@oh-my-pi/pi-mnemopi@18.0.0"
  - "@oh-my-pi/pi-natives-darwin-arm64@18.0.0"
  - "@oh-my-pi/pi-natives-darwin-x64@18.0.0"
  - "@oh-my-pi/pi-natives-linux-arm64@18.0.0"
  - "@oh-my-pi/pi-natives-linux-x64@18.0.0"
  - "@oh-my-pi/pi-natives-win32-x64@18.0.0"
  - "@oh-my-pi/pi-natives@18.0.0"
  - "@oh-my-pi/pi-tui@18.0.0"
  - "@oh-my-pi/pi-utils@18.0.0"
  - "@oh-my-pi/pi-wire@18.0.0"
  - "@oh-my-pi/snapcompact@18.0.0"
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - vite-plus@1.0.0

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

# One version per name for the library and docs/, which bundles the library from ../src.
catalogs:
  deps:
    "@agntn/hashes": 0.7.2
    "@agntn/tools": 0.2.4
    "@modelcontextprotocol/sdk": 1.30.1
    "@modelcontextprotocol/server": 2.2.0
    "@nuxtjs/mcp-toolkit": 0.19.0
    agents: 0.26.0
    better-sqlite3: 12.11.1
    citty: 0.2.2
    docus: 5.13.0
    nuxt: 4.5.2
    scule: 1.3.0
    ufo: 1.6.4
    zod: 4.6.5
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 1.4.0
    "@iconify-json/lucide": 1.2.138
    "@iconify-json/simple-icons": 1.2.98
    "@iconify-json/token": 1.2.42
    "@iconify-json/vscode-icons": 1.2.83
    "@modelcontextprotocol/client": 2.2.0
    "@nuxt/content": 3.16.1
    "@nuxt/ui": 4.11.2
    "@oh-my-pi/pi-coding-agent": 18.0.0
    "@types/node": 26.2.0
    "@vueuse/core": 14.4.0
    ai: 7.0.127
    changelogen: 0.6.2
    obuild: 0.4.43
    shiki: 4.5.0
    typescript: 7.0.2
    wrangler: 4.128.0

cleanupUnusedCatalogs: true

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore
